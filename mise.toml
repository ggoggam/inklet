# Standalone toolchain; CI also loads the JDK from mise.ci.toml.
min_version = "2026.8.5"

[settings]
lockfile = true

[tools]
prek = "0.4.8"
ktlint = "1.8.0"

[tasks.test]
description = "Run geometry and rendered-control tests, and compile the desktop gallery"
run = "./gradlew --no-daemon desktopTest :sample:desktopTest :sample:desktopJar"

[tasks.sample]
description = "Run the interactive desktop gallery"
run = "./gradlew :sample:run"

[tasks."dev:web"]
description = "Run the interactive Wasm gallery in a browser"
run = "./gradlew :sample:wasmJsBrowserDevelopmentRun"

[tasks."web:build"]
description = "Build the Wasm gallery for static hosting"
run = "./gradlew --no-daemon :sample:wasmJsBrowserDistribution"

[tasks."web:test"]
description = "Run shared geometry tests in headless Chrome (requires Chrome or CHROME_BIN)"
run = "./gradlew --no-daemon :wasmJsBrowserTest"

[tasks."android:compile"]
description = "Compile the Android library without a device"
run = "./gradlew --no-daemon compileAndroidMain"

[tasks."dev:android"]
description = "Build, install and launch the Android gallery on the preferred device"
shell = "bash -c"
run = '''
set -euo pipefail

# explicit choice, connected phone, running emulator, then a cold AVD.
devices="$(adb devices)"
serial="${ANDROID_SERIAL:-}"
if [ -n "$serial" ]; then
  if ! awk -v serial="$serial" '$1 == serial && $2 == "device" { found = 1 } END { exit !found }' <<< "$devices"; then
    echo "Android device '$serial' is not connected and authorized (see 'adb devices')." >&2
    exit 1
  fi
else
  serial="$(awk '$2 == "device" && $1 !~ /^emulator-/ { print $1; exit }' <<< "$devices")"
  if [ -z "$serial" ]; then
    serial="$(awk '$2 == "device" { print $1; exit }' <<< "$devices")"
  fi
fi

if [ -z "$serial" ]; then
  avds="$(android emulator list)"
  avd="$(awk 'NF { print; exit }' <<< "$avds")"
  if [ -z "$avd" ]; then
    echo "No device attached and no AVD to start (see 'android emulator create')." >&2
    exit 1
  fi
  echo "Starting Android emulator: $avd"
  android emulator start "$avd"
  devices="$(adb devices)"
  serial="$(awk '$2 == "device" && $1 ~ /^emulator-/ { print $1; exit }' <<< "$devices")"
  if [ -z "$serial" ]; then
    echo "Emulator '$avd' started but adb sees no ready emulator." >&2
    exit 1
  fi
fi

echo "Target Android device: $serial"
./gradlew --no-daemon :sample:androidApp:assembleDebug
android run --device="$serial" \
  --apks=sample/androidApp/build/outputs/apk/debug/androidApp-debug.apk \
  --activity=dev.ggoggam.inklet.sample.MainActivity
'''

[tasks."ios:compile"]
description = "Compile both iOS targets (requires macOS and Xcode)"
run = "./gradlew --no-daemon compileKotlinIosArm64 compileKotlinIosSimulatorArm64"

[tasks."dev:ios"]
description = "Build, install and launch the iOS gallery on the preferred simulator"
shell = "bash -c"
run = '''
set -euo pipefail

if [ "$(uname -s)" != Darwin ] || [ "$(uname -m)" != arm64 ]; then
  echo "The iOS gallery requires an Apple Silicon Mac with Xcode (iosSimulatorArm64 target)." >&2
  exit 1
fi

# Prefer an explicit choice, a booted simulator, then the first available iPhone.
# Parse JSON so names shared by multiple runtimes can be disambiguated with a UDID.
devices="$(xcrun simctl list devices available --json)"
udid="$(python3 -c '
import json
import sys

preference = sys.argv[1]
devices = [
    device
    for runtime, entries in json.load(sys.stdin)["devices"].items()
    if ".iOS-" in runtime
    for device in entries
    if device.get("isAvailable", False)
]
if preference:
    matches = [d for d in devices if preference in (d["name"], d["udid"])]
    if not matches:
        sys.exit(f"No available iOS simulator matches {preference!r}.")
    if len(matches) > 1:
        sys.exit("Multiple simulators match; set INKLET_SIM to a UDID: "
                 + ", ".join(d["udid"] for d in matches))
else:
    matches = [d for d in devices if d["state"] == "Booted"]
    if not matches:
        matches = [d for d in devices if d["name"].startswith("iPhone")]
    if not matches:
        sys.exit("No iPhone simulator available (see xcrun simctl list devices).")
print(matches[0]["udid"])
' "${INKLET_SIM:-}" <<< "$devices")"

# boot can fail for an already-booted simulator; bootstatus still must succeed.
xcrun simctl boot "$udid" 2>/dev/null || true
open -a Simulator --args -CurrentDeviceUDID "$udid"
xcrun simctl bootstatus "$udid" -b
echo "Target iOS simulator: $udid"
# The Xcode build phase builds and embeds :sample's Kotlin framework.
dd="{{ config_root }}/sample/build/ios"
xcodebuild -project sample/iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
  -destination "platform=iOS Simulator,id=$udid" -derivedDataPath "$dd" build
app="$dd/Build/Products/Debug-iphonesimulator/iosApp.app"
[ -d "$app" ] || { echo "Build produced no app at '$app'." >&2; exit 1; }
xcrun simctl install "$udid" "$app"
xcrun simctl launch --terminate-running-process "$udid" dev.ggoggam.inklet.sample
'''

[tasks.lint]
description = "Check Kotlin formatting"
run = 'ktlint "**/*.kt" "**/*.kts" "!**/build/**" "!**/.gradle/**"'

[tasks."kt:fmt"]
description = "Format Kotlin sources and build scripts"
run = 'ktlint --format "**/*.kt" "**/*.kts" "!**/build/**" "!**/.gradle/**"'

[tasks."pre-commit"]
description = "Run project hooks with prek"
run = "prek run --show-diff-on-failure --color=always --all-files --hook-stage=manual"

[tasks.publish]
description = "Publish all library targets to Maven Central (requires macOS, credentials and signing key)"
run = "./gradlew --no-daemon --no-configuration-cache publishAndReleaseToMavenCentral"

[tasks."publish:local"]
description = "Publish all library targets to Maven Local without signing (requires macOS)"
run = "./gradlew --no-daemon --no-configuration-cache publishToMavenLocal -PsignAllPublications=false"
