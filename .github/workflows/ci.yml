name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_ENV: ci

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          version: "2026.8.5"
          install_args: "--locked"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: mise run pre-commit
      - run: mise run test
      - run: mise run android:compile
      - run: mise run web:test
      - run: mise run web:build
      - uses: actions/upload-artifact@v4
        with:
          name: web-gallery
          path: sample/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/
            sample/build/reports/tests/
            sample/build/reports/containers/
            sample/build/reports/text-fields/
          if-no-files-found: ignore
