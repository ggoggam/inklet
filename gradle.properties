org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Publishing follows Vitre: a VERSION_NAME change on main releases to Maven Central.
# The LOCAL placeholder is skipped until credentials and the first release are ready.
GROUP=dev.ggoggam.inklet
VERSION_NAME=0.1.0-LOCAL
mavenCentralPublishing=true
signAllPublications=true

POM_ARTIFACT_ID=inklet
POM_NAME=Inklet
POM_DESCRIPTION=Hand-drawn Compose Multiplatform components and drawing primitives for Android, iOS and desktop.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/ggoggam/inklet
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://github.com/ggoggam/inklet/blob/main/LICENSE
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/ggoggam/inklet
POM_SCM_CONNECTION=scm:git:https://github.com/ggoggam/inklet.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/ggoggam/inklet.git
POM_DEVELOPER_ID=ggoggam
POM_DEVELOPER_NAME=Joon Kwon
POM_DEVELOPER_URL=https://github.com/ggoggam
